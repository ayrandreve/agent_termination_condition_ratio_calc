[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ayrandreve-agent_termination_condition_ratio_calc"
version = "0.1.0"
description = "从输入中抽取数值，计算广告召回与排序工程师·智能体的任务终止条件相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ayrandreve" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ayrandreve.github.io"
Repository = "https://github.com/ayrandreve/agent_termination_condition_ratio_calc"
Issues = "https://github.com/ayrandreve/agent_termination_condition_ratio_calc/issues"

[project.scripts]
agent_termination_condition_ratio_calc = "agent_termination_condition_ratio_calc:main"

[tool.setuptools]
py-modules = ["agent_termination_condition_ratio_calc"]
